name: Publish Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out tagged files
        uses: actions/checkout@v4

      - name: Validate host builds, package companions and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "rhino-plugin-$env:RELEASE_TAG"
          $json = & powershell -NoProfile -ExecutionPolicy Bypass -File ./PackageRelease.ps1 -Version $env:RELEASE_TAG -OutputDirectory $destination
          if ($LASTEXITCODE -ne 0) { throw 'Release validation or packaging failed.' }
          $assets = @((($json -join "`n") | ConvertFrom-Json).Assets)
          $name = (Get-ChildItem -Filter '*.csproj' -File | Select-Object -First 1).BaseName
          $release = & gh release view $env:RELEASE_TAG --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = @((($release -join "`n") | ConvertFrom-Json).assets.name)
            $missing = @($assets | Where-Object { [IO.Path]::GetFileName($_) -notin $existing })
            if ($missing.Count -gt 0) { & gh release upload $env:RELEASE_TAG @missing }
            else { Write-Host 'All assets already published; existing assets retained.' }
          } else {
            & gh release create $env:RELEASE_TAG @assets --verify-tag --title "$name $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
